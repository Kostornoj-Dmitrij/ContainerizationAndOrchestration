replicaCount: 2

image:
  repository: api
  tag: lab2
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

otel:
  endpoint: "http://jaeger-collector.observability.svc.cluster.local:4317"

serviceMonitor:
  enabled: false