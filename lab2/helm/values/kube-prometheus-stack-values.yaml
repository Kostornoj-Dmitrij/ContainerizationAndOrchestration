prometheus:
  service:
    type: NodePort
    nodePort: 30001
  prometheusSpec:
    retention: 6h
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}
    ruleNamespaceSelector: {}
    additionalScrapeConfigs:
      - job_name: cadvisor
        scrape_interval: 15s
        static_configs:
          - targets: [ '192.168.1.108:8081' ]

grafana:
  service:
    type: NodePort
    nodePort: 30000
  adminPassword: admin
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  additionalDataSources: []
  sidecar:
    datasources:
      enabled: true

alertmanager:
  service:
    type: NodePort
    nodePort: 30003
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    configSecret: alertmanager-config

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

kubelet:
  enabled: true

coreDns:
  enabled: true

kubeApiServer:
  enabled: true

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

additionalPrometheusRulesMap:
  api-alerts:
    groups:
      - name: api.rules
        rules:
          - alert: ApiHighErrorRate
            expr: |
              sum(rate(http_requests_total{job="api", status=~"5.."}[5m]))
                /
              sum(rate(http_requests_total{job="api"}[5m]))
                > 0.05
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Высокая доля 5xx у api ({{ $value | humanizePercentage }})"
              description: "Больше 5% запросов к api за последние 5 минут возвращают 5xx. Пользователи видят ошибки."

          - alert: ApiHighLatencyP95
            expr: |
              histogram_quantile(0.95,
                sum by (le) (rate(http_request_duration_seconds_bucket{job="api", exported_endpoint!="/slow"}[5m]))
              ) > 1.0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "p95 времени ответа api выше 1с ({{ $value | humanizeDuration }})"
              description: "95-й процентиль времени ответа api превышает 1 секунду (без /slow). У 5% пользователей запросы висят долго."

          - alert: ApiDown
            expr: absent(up{job="api"}) or (sum(up{job="api"}) < 1)
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "api недоступен"
              description: "Prometheus не получает метрики ни от одного пода api - сервис полностью недоступен."
      - name: container.rules
        rules:
          - alert: ContainerMemoryUsageHigh
            expr: |
              container_memory_working_set_bytes{name="api-docker"} > 200 * 1024 * 1024
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Контейнер api-docker ест >200MB памяти"
              description: "Рабочий набор страниц контейнера api-docker превышает 200 МБ больше 2 минут. При лимите 256 МБ это близко к OOMKilled."

          - alert: ContainerCpuThrottlingHigh
            expr: |
              rate(container_cpu_cfs_throttled_seconds_total{name="api-docker"}[5m]) > 0.1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Контейнер api-docker throttled ({{ $value | humanize }})"
              description: "CFS throttling контейнера api-docker > 0.1 с/с в течение 5 минут. Контейнеру не хватает CPU-квоты."

          - alert: ContainerDown
            expr: |
              absent(container_last_seen{name="api-docker"})
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Контейнер api-docker недоступен"
              description: "cAdvisor перестал видеть контейнер api-docker. Он упал, остановлен или узел потерял с ним связь."