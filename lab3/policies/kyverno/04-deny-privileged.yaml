apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: deny-privileged
  annotations:
    policies.kyverno.io/title: Deny Privileged Containers
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-privileged
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - kyverno
                - monitoring
                - cnpg-system
                - postgres-operator
                - local-path-storage
      validate:
        message: "Privileged containers are not allowed."
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                any:
                  - key: "{{ element.securityContext.privileged || 'false' }}"
                    operator: Equals
                    value: true