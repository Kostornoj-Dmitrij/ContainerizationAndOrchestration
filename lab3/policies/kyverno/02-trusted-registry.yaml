apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: trusted-registry
  annotations:
    policies.kyverno.io/title: Only Trusted Registries
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: validate-registries
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - kyverno
                - monitoring
                - cnpg-system
                - postgres-operator
                - local-path-storage
      validate:
        message: "Only images from trusted sources are allowed (localhost/, shop-*, docker.io/library/)."
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                all:
                  - key: "{{ element.image }}"
                    operator: AnyNotIn
                    value:
                      - "localhost/*"
                      - "shop-*"
                      - "shop-*:*"
                      - "docker.io/library/*"
                      - "registry.opensource.zalan.do/*"