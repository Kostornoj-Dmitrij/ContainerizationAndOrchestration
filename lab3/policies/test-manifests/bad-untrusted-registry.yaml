apiVersion: v1
kind: Pod
metadata:
  name: bad-untrusted-registry
  namespace: default
  labels:
    app.kubernetes.io/name: bad-untrusted-registry
    app.kubernetes.io/part-of: shop
spec:
  containers:
    - name: app
      image: evil.io/malware:1.0
      resources:
        requests: { cpu: 100m, memory: 64Mi }
        limits: { cpu: 200m, memory: 128Mi }