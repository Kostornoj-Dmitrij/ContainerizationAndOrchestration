apiVersion: v1
kind: Pod
metadata:
  name: bad-privileged
  namespace: default
  labels:
    app.kubernetes.io/name: bad-privileged
    app.kubernetes.io/part-of: shop
spec:
  containers:
    - name: app
      image: docker.io/library/nginx:1.25
      securityContext:
        privileged: true
      resources:
        requests: { cpu: 100m, memory: 64Mi }
        limits: { cpu: 200m, memory: 128Mi }